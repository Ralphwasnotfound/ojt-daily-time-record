# Local-only S1 project. No hosted project reference or provider credentials.
project_id = "ojt-dtr-s1-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
# No Google provider or secrets configured. SQL tests create synthetic Auth fixtures.

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
